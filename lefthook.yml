# The unforgeable floor (DESIGN.md §7). pre-commit = seconds; full suite at push.
# piped: rewriters run before readers; first failure aborts (single clear error).
pre-commit:
  piped: true
  commands:
    ruff-check:
      glob: "*.py"
      priority: 1
      run: ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      priority: 2
      run: ruff format {staged_files}
      stage_fixed: true
    secrets:
      priority: 3
      run: sh -c '. plugins/xp-plugin/templates/hook-lib.sh; secrets_scan_index'
    constraints-size:
      priority: 4
      run: sh -c '. plugins/xp-plugin/templates/hook-lib.sh; constraints_size'
    fast-tests:
      priority: 5
      # exit 5 = no tests collected — legal while the suite is growing
      run: sh -c '. plugins/xp-plugin/templates/hook-lib.sh; run_tier fast; s=$?; [ $s -eq 5 ] && exit 0; exit $s'

pre-merge-commit:
  commands:
    secrets:
      run: sh -c '. plugins/xp-plugin/templates/hook-lib.sh; secrets_scan_index'

# pre-push RE-CHECKS what pre-commit checked, over outgoing commits rather than
# staged files. A `--no-verify` or `core.hooksPath` bypass leaves no trace in the
# commit, so the ACT is unverifiable after the fact — but every commit-stage gate
# here is a pure function of the tree, so the OUTCOME still is (a8195145).
pre-push:
  # piped, for the same reason pre-commit is, plus one this hook learned the hard
  # way: unpiped, lefthook runs ruff over the whole tree, gitleaks over every
  # commit, and `pytest -n auto` — which already saturates the CPU — all at once.
  # Measured at the sprint-7 land: two pushes of
  # a green tree failed on two DIFFERENT wall-clock tests, both passing alone and
  # in a direct full tier. A wall that manufactures the contention that reds its
  # own timing tests teaches the lead to re-run until green, which is how
  # --no-verify becomes tempting (debt 15aec3fc's risk, arriving sideways).
  piped: true
  # secrets FIRST: lefthook orders UNPRIORITISED commands alphabetically, which
  # measured this scan running last, 5m21s behind the tier it is meant to guard.
  commands:
    secrets:
      priority: 1
      run: sh -c '. plugins/xp-plugin/templates/hook-lib.sh; secrets_scan_push'
      use_stdin: true
    lint:
      run: ruff check .
    constraints-size:
      run: sh -c '. plugins/xp-plugin/templates/hook-lib.sh; constraints_size'
    full-tests:
      run: sh -c '. plugins/xp-plugin/templates/hook-lib.sh; run_tier story; s=$?; [ $s -eq 5 ] && exit 0; exit $s'
    falsifier-node-ids:
      run: python3 tests/scripts/check_falsifier_node_ids.py
