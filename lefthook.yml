# This repo's wall: lint, secrets and the quick tests at commit; the whole suite at push.
# Hooks own the test commands (docs/PLAN-v1.md §6); nothing restates them in config.
source_dir: .lefthook
pre-commit:
  piped: true
  commands:
    ruff-check:
      glob: "*.py"
      priority: 1
      run: ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      priority: 2
      run: ruff format {staged_files}
      stage_fixed: true
    secrets:
      priority: 3
      run: sh -c '. plugins/xp-plugin/templates/hook-lib.sh; secrets_scan_index'
    tests:
      priority: 4
      # exit 5 = nothing collected, legal while the suite is being rebuilt
      run: sh -c 'pytest -q -n 4; s=$?; [ $s -eq 5 ] && exit 0; exit $s'

pre-merge-commit:
  commands:
    secrets:
      run: sh -c '. plugins/xp-plugin/templates/hook-lib.sh; secrets_scan_index'

pre-push:
  piped: true
  jobs:
    - script: secrets
      runner: sh
      use_stdin: true
    - name: lint
      run: ruff check .
    - name: tests
      run: sh -c 'pytest -q -n 4; s=$?; [ $s -eq 5 ] && exit 0; exit $s'

sprint:
  commands:
    tests:
      run: pytest -q -n 6
    ratchet:
      run: python3 tests/scripts/ratchet.py
