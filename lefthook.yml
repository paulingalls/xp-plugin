# The unforgeable floor (DESIGN.md §7). pre-commit = seconds; full suite at push.
# piped: rewriters run before readers; first failure aborts (single clear error).
pre-commit:
  piped: true
  commands:
    ruff-check:
      glob: "*.py"
      priority: 1
      run: ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      priority: 2
      run: ruff format {staged_files}
      stage_fixed: true
    secrets:
      priority: 3
      run: gitleaks protect --staged --no-banner --redact
    fast-tests:
      priority: 4
      # exit 5 = no tests collected — legal while the suite is growing
      run: sh -c 'pytest -q -n auto -m "not slow"; s=$?; [ $s -eq 5 ] && exit 0; exit $s'

# pre-push RE-CHECKS what pre-commit checked, over the whole tree rather than
# staged files. A `--no-verify` or `core.hooksPath` bypass leaves no trace in the
# commit, so the ACT is unverifiable after the fact — but every commit-stage gate
# here is a pure function of the tree, so the OUTCOME still is (a8195145).
pre-push:
  commands:
    lint:
      run: ruff check .
    secrets:
      run: gitleaks git --no-banner --redact
    full-tests:
      run: sh -c 'pytest -q -n auto; s=$?; [ $s -eq 5 ] && exit 0; exit $s'
    ratchet:
      run: python3 tests/scripts/ratchet.py
