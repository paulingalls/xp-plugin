# xp project config — EDIT the tiers for your stack, then re-run your first commit
release: sprint      # sprint = stories integrate on a sprint branch, sprint close PRs trunk
# codex_sandbox: danger-full-access  # Codex only: workspace-write | danger-full-access
# trunk: develop       # releases land/tag here; any develop -> main cut stays yours
# lifecycle_command: ./scripts/xp-lifecycle "fixed value"  # argv prefix, no shell
#                    # receives sprint-open/story-close/sprint-close and the id
sprint_cap: 6        # max stories per sprint
debt_budget: 0.2     # max share of sprint stories that are scheduled debt
constraints_cap: 15  # constraints.md line-items; add-over-cap requires a retire
constraints_chars_cap: 4500  # hard character ceiling; retire or shorten a rule
# version_files: path/to/manifest.json  # comma-separated JSON manifests
# teardown_timeout: 60  # seconds before close kills worktree teardown
# review:
#   verify_batches: 2   # sprint-close verifier AGENTS per round. Bounds the
#                       # spend: candidates are batched across this many, never
#                       # one agent per candidate.

roles:               # harness/model[/effort]; the lead overrides per story in plan.md
  lead: claude/opus
  executor: claude/sonnet/medium
  reviewer: claude/opus
  plan-reviewer: claude/opus   # scripts/plan_review.py; a teammate runs it itself
  finder: claude/opus     # the four round-1 stages of `close.py sprint <id> review`;
  verifier: claude/opus   # each falls back to `reviewer` when its key is absent, so
  fixer: claude/opus      # an older config keeps working untouched
  closer: claude/opus

tests:
  fast: EDIT-ME      # pre-commit: seconds (e.g. `pytest -q -m "not slow"` or `bun test --changed`)
  story: EDIT-ME     # pre-push + story close (e.g. `pytest -q`)
  full: EDIT-ME      # sprint close: everything incl. e2e
