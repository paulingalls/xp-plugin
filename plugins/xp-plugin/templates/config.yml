# trunk: develop           # only when releases do not land on the default branch
versioning: off            # off: project owns versions/tags; on: tag each release;
                           # notes: branches carry notes, stamp after merge
# version_files: package.json   # with versioning on or notes: comma-separated JSON manifests whose
#                                # "version" the tag must match; `none` tags without that wall
# worktree_setup: bun install   # before agents and changed-tree free post-merge proof
# Must be safe to re-run in an existing worktree; post-merge setup failure keeps it.
# worktree_teardown: sh scripts/stop-worktree.sh   # after free PR handoff and before removal
# Must be safe to run twice; nonzero warns and cleanup continues.
# lifecycle_command: sh scripts/lifecycle.sh   # appended event + id; red refuses open/merge/tag
# Projects bound their scripts and tolerate retries; free patches emit no lifecycle events.
debt_budget: 0.2
# codex_sandbox: danger-full-access   # workspace-write | danger-full-access
roles:                     # harness/model[/effort]; a card's Executor: line overrides
  lead: claude/opus
  planner: claude/sonnet
  executor: claude/sonnet
  reviewer: claude/opus    # story diff reviews; pick a different family from executor
  # Optional seats, each falling back to its family when unset:
  # plan-reviewer: claude/opus      # one card's plan        (falls back to reviewer)
  # slate-reviewer: claude/opus     # the sprint slate       (falls back to plan-reviewer)
  # angle-reviewer: claude/opus     # sprint review angles   (falls back to reviewer)
  # fixer: claude/sonnet            # the sprint fix pass    (falls back to executor)

# notes mode: add changes/<actual-git-branch>.md before free/sprint land:
# Bump: major|minor|patch (exactly one, required), user body, Release steps: none. or list.
# Keep CHANGELOG.md and manifest versions unchanged on branches.
# After post-merge, run xp.py release stamp on clean trunk equal to origin.
# The stamp commits and pushes directly to trunk, atomically with its annotated tag;
# protected trunk needs a bypass for that push. Publication is CHANGELOG only.
