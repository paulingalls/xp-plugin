# trunk: develop           # only when releases do not land on the default branch
versioning: off            # off: the project owns versions and tags; on: each release is
                           # tagged, and version_files must then be set
# version_files: package.json   # with versioning on: comma-separated JSON manifests whose
#                                # "version" the tag must match; `none` tags without that wall
sprint_cap: 6
debt_budget: 0.2
# codex_sandbox: danger-full-access   # workspace-write | danger-full-access
roles:                     # harness/model[/effort]; a card's Executor: line overrides
  lead: claude/opus
  planner: claude/sonnet
  executor: claude/sonnet
  reviewer: claude/opus    # plan and diff reviews; pick a different family from executor
  # plan-reviewer: codex/gpt-6.1-sol/high   # optional: slate and plan reviews on another harness
