# xp wall (lefthook variant) — tiers read from .xp/config.yml at run time
# via .githooks/hook-lib.sh (written by setup alongside this file)
source_dir: .githooks
pre-commit:
  piped: true
  commands:
    secrets:
      priority: 1
      run: sh -c '. .githooks/hook-lib.sh; secrets_scan_index'
    fast-tier:
      priority: 2
      run: sh -c '. .githooks/hook-lib.sh; run_tier fast'
pre-merge-commit:
  commands:
    secrets:
      run: sh -c '. .githooks/hook-lib.sh; secrets_scan_index'
pre-push:
  piped: true
  jobs:
    - script: secrets
      runner: sh
      use_stdin: true
    - name: story-tier
      run: sh -c '. .githooks/hook-lib.sh; run_tier story'
