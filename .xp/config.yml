# xp-plugin project config (dogfood instance)
release: sprint
sprint_branch: sprint-002     # sprint = stories integrate on a sprint branch, sprint close PRs main; story = every close releases
sprint_cap: 6          # max stories per sprint
debt_budget: 0.2       # max share of sprint stories that are scheduled debt
constraints_cap: 15    # constraints.md line-items; add-over-cap requires a retire

roles:                 # harness/model[/effort]; lead overrides per story in plan.md
  lead: claude/opus
  executor: claude/sonnet/medium
  reviewer: claude/opus     # cross-harness (codex) once the adapter ships

tests:
  fast: pytest -q -n auto -m "not slow"     # pre-commit
  story: pytest -q -n auto          # pre-push + story close
  full: pytest -q -n auto           # sprint close (diverges when e2e/meta lands)
