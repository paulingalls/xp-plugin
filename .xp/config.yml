# xp-plugin project config (dogfood instance)
release: sprint
sprint_branch: sprint-006
sprint_cap: 6          # max stories per sprint
debt_budget: 0.2       # max share of sprint stories that are scheduled debt
constraints_cap: 15    # constraints.md line-items; add-over-cap requires a retire

roles:                 # harness/model[/effort]; lead overrides per story in plan.md
  lead: claude/opus
  executor: codex/gpt-5.6-sol/high  # Sprint-5 retro, Paul: codex authoring proven at 028 — opus reviews, codex writes
  reviewer: claude/opus/high  # Sprint-5 retro, Paul: the inverse pairing — codex authors, opus reviews (its 028 round was the sprint's best). /high at Sprint-6 open (Paul): the segment had never been set, so every round to date ran at the harness default — unknown, and unknowable from here
  plan-reviewer: claude/opus/high  # nested codex-in-codex denied by the sandbox (app-server IPC, note 138eabf0); nested claude is the walk-proven arm — and claude planning-reviews a codex author IS the diversity pattern

tests:
  fast: pytest -q -n auto -m "not slow"     # pre-commit
  story: pytest -q -n auto          # pre-push + story close
  full: pytest -q -n auto           # sprint close (diverges when e2e/meta lands)
