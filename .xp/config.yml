# xp-plugin project config (dogfood instance)
release: sprint
codex_sandbox: danger-full-access  # Codex only: workspace-write | danger-full-access
sprint_cap: 6          # max stories per sprint
debt_budget: 0.2       # max share of sprint stories that are scheduled debt
constraints_cap: 15    # constraints.md line-items; add-over-cap requires a retire
constraints_chars_cap: 4500  # hard character ceiling; retire or shorten a rule
version_files: plugins/xp-plugin/.claude-plugin/plugin.json

roles:                 # harness/model[/effort]; lead overrides per story in plan.md
  lead: claude/opus
  executor: codex/gpt-5.6-sol/high  # Sprint-5 retro, Paul: codex authoring proven at 028 — opus reviews, codex writes
  reviewer: claude/opus/high  # Sprint-5 retro, Paul: the inverse pairing — codex authors, opus reviews (its 028 round was the sprint's best). /high at Sprint-6 open (Paul): the segment had never been set, so every round to date ran at the harness default — unknown, and unknowable from here
  plan-reviewer: claude/opus/high  # Codex authors; Claude supplies independent model and harness pressure before code exists
  # Sprint-9 open (lead): the four review STAGES, added because story-053 ships the
  # keys and test_dogfood requires us to carry every key the scaffold ships. All four
  # hold today's behaviour — claude/opus/high, what `reviewer` already resolved to —
  # so this sprint's own close is unchanged by the card that enables the choice.
  # WHERE VARIETY WOULD PAY IS `finder` (card 053's constraint-3 argument: three blind
  # finders on ONE model are three samples of one model's blind spots), and that is
  # Paul's call at the retro, not a lead's under release pressure — his Sprint-5
  # pairing is codex authors / claude reviews, and flipping finders to codex inverts
  # it for the stage that feeds every other one.
  finder: claude/opus/high
  verifier: claude/opus/high
  fixer: claude/opus/high
  closer: claude/opus/high

tests:
  fast: pytest -q -n auto -m "not slow"     # pre-commit
  story: pytest -q -n auto          # pre-push + story close
  full: pytest -q -n auto           # sprint close (diverges when e2e/meta lands)
